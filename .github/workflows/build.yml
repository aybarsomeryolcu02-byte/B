name: Build ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    env:
      OS_NAME: StarkOS
    steps:
      - name: Araclari kur
        run: |
          apt-get update
          apt-get install -y live-build debootstrap xorriso squashfs-tools mtools dosfstools isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin ca-certificates

      - name: Yapilandirma
        run: |
          mkdir -p iso && cd iso
          lb config \
            --distribution trixie \
            --architectures amd64 \
            --linux-flavours amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --bootloaders "syslinux,grub-efi" \
            --debian-installer none \
            --memtest none \
            --iso-application "$OS_NAME" \
            --iso-publisher "$OS_NAME" \
            --iso-volume "$OS_NAME" \
            --bootappend-live "boot=live components quiet locales=tr_TR.UTF-8 keyboard-layouts=tr timezone=Europe/Istanbul"

          mkdir -p config/package-lists config/archives config/hooks/normal

          cat > config/package-lists/stark.list.chroot <<'EOF'
          kde-plasma-desktop
          sddm
          plasma-nm
          network-manager
          konsole
          dolphin
          kate
          ark
          firefox-esr
          pipewire-audio
          flatpak
          plasma-discover-backend-flatpak
          sudo
          locales
          keyboard-configuration
          console-setup
          firmware-linux
          firmware-misc-nonfree
          firmware-realtek
          firmware-iwlwifi
          firmware-amd-graphics
          mesa-vulkan-drivers
          libgl1-mesa-dri
          mesa-utils
          vulkan-tools
          gamemode
          calamares
          calamares-settings-debian
          EOF

          echo "deb http://deb.debian.org/debian trixie-backports main contrib non-free non-free-firmware" > config/archives/backports.list.chroot
          cp config/archives/backports.list.chroot config/archives/backports.list.binary
          cat > config/archives/backports.pref.chroot <<'EOF'
          Package: linux-image-* mesa-* libgl1-mesa-dri libglx-mesa0 libegl-mesa0 libgbm1 libglapi-mesa
          Pin: release a=trixie-backports
          Pin-Priority: 900
          EOF
          cp config/archives/backports.pref.chroot config/archives/backports.pref.binary

          cat > config/hooks/normal/0100-gaming.hook.chroot <<'EOF'
          #!/bin/sh
          set -e
          export DEBIAN_FRONTEND=noninteractive
          dpkg --add-architecture i386
          apt-get update
          echo "steam steam/question select I AGREE" | debconf-set-selections
          echo "steam steam/license note " | debconf-set-selections
          apt-get install -y steam-installer mangohud libgl1-mesa-dri:i386 mesa-vulkan-drivers:i386
          EOF

          cat > config/hooks/normal/0200-brand.hook.chroot <<EOF
          #!/bin/sh
          sed -i --follow-symlinks 's/^PRETTY_NAME=.*/PRETTY_NAME="$OS_NAME"/' /etc/os-release
          EOF

          chmod +x config/hooks/normal/*

      - name: ISO uret
        run: cd iso && lb build

      - name: ISO yukle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OS_NAME }}-iso
          path: iso/*.iso
